; REX — standalone ESP32-S3 build
; Board: ESP32-S3-WROOM-1 N16R8 (16MB flash, 8MB octal PSRAM)
; Display: 3.2" ILI9341 240x320 SPI (MSP3217)
;
; Plug into the UART USB-C port (the one nearest the board edge, CP2102).

[env:rex]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; --- N16R8 memory: 16MB flash + octal PSRAM ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0
    consentiumiot/EdgeNeuron@^1.2.3   ; TFLite Micro runtime, for wake-word detection
    links2004/WebSockets@^2.7.3       ; EXPERIMENTAL — WSS client for streaming STT (ENABLE_STREAMING_STT only). Re-check for a newer release at implementation time.

; Default toolchain is C++11, which disallows aggregate init on
; structs with default member initializers (used throughout the
; face engine's data types) — bump to C++17.
build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    ; -DFACE_RENDER_DEBUG   ; uncomment for FPS/frame-time/sprite-size prints
    -DENABLE_VOICE        ; uncomment once WiFi/STT round-trip is ready (mic is wired and working)
    -DENABLE_AI           ; uncomment for REX's real personality via Claude (/ask <text>) — needs src/Secrets.h's ANTHROPIC_API_KEY
    -DENABLE_TTS          ; uncomment for text-to-speech via ElevenLabs (/say <text>) — needs src/Secrets.h's ELEVENLABS_API_KEY
    -DENABLE_TOOLS        ; uncomment for weather/time tool-calling (/weather, /time) — no API key needed (Open-Meteo + SNTP)
    -DENABLE_WAKEWORD     ; always-on "Hey REX" listener, wired into VoiceController (needs ENABLE_VOICE) — see WakeWordModel.h
    -DENABLE_STREAMING_STT  ; Swaps batch Whisper STT for OpenAI realtime streaming STT via a separate StreamingVoiceController (needs ENABLE_VOICE; reuses OPENAI_API_KEY, no new secret). Live-verified: STT sub-step 824ms vs. batch's measured 3.4-4.3s, with the full wake-word/tool-call/TTS/follow-up-window pipeline all working identically. Comment out to fall back to the original batch path (VoiceController/SpeechToTextClient — untouched, still fully intact) if this ever needs reverting.
    -DENABLE_USB_CONSOLE    ; Mirrors a handful of key diagnostic lines (boot, heard/replied, errors, watchdogs — see DebugMirror.h) to USBSerial, the native-USB console on GPIO19/20 (the panel-mount breakout). Serial/UART0/CP2102 is completely unchanged by this — only one of the two ports is ever connected at a time in the final enclosure, so both stay live in every build with no reflash needed to pick which.
    -DBOARD_HAS_PSRAM

    ; Serial over the CP2102 UART port, not native USB
    -DARDUINO_USB_CDC_ON_BOOT=0

    ; ---- TFT_eSPI: configured here, NOT in User_Setup.h ----
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320

    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=13
    -DTFT_RST=14
    -DTFT_MISO=9
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH

    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSMOOTH_FONT=1
    -DLOAD_GFXFF=1   ; Adafruit-GFX "Free Fonts" (bold/sized text) for the splash screen

    ; Dropped to 27MHz — white screen with no serial error at 40MHz
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000
    -DUSE_HSPI_PORT
